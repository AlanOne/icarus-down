<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup B: Equalizer</title>
<!-- Mockup only: the real site self-hosts this font via @fontsource. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000;          /* the logo's own black */
    --white: #fff;
    --grey: #9a9a9a;
    --bar: #fff;
    --font: 'Jost', sans-serif;   /* geometric, lowercase-friendly, like the wordmark */
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--black); color: var(--white); font: 400 1.0625rem/1.6 var(--font); }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--white); outline-offset: 4px; }

  /* The logo's seven bars become the nav: the tall middle bar marks where you are. */
  header { display: flex; justify-content: center; padding: 1.25rem 1rem 0; }
  nav ul { display: flex; align-items: flex-end; gap: clamp(.5rem, 2vw, 1.25rem); list-style: none; margin: 0; padding: 0; }
  nav a { display: flex; flex-direction: column; align-items: center; gap: .5rem; text-decoration: none; font-size: .9375rem; color: var(--grey); }
  nav a::before { content: ''; width: clamp(.9rem, 3vw, 1.4rem); height: var(--h); background: var(--bar); }
  nav a[aria-current] { color: var(--white); }
  nav a:hover { color: var(--white); }

  .hero { display: grid; justify-items: center; text-align: center; padding: clamp(2rem, 6vw, 4rem) 1rem 0; }
  .wordmark { font-weight: 300; font-size: clamp(3.25rem, 13vw, 9rem); line-height: 1; letter-spacing: -.02em; margin: 0; }
  .photo { width: 100%; max-width: 80rem; margin-top: clamp(1.5rem, 4vw, 3rem); aspect-ratio: 21 / 9; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; filter: grayscale(1) contrast(1.25) brightness(1.1); }
  .release { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 1rem 2rem; padding: 2rem 1rem; }
  .release p { margin: 0; text-align: left; }
  .release strong { display: block; font-weight: 600; font-size: 1.5rem; line-height: 1.2; }
  .release span { color: var(--grey); }
  .btn { display: inline-block; padding: .85rem 1.75rem; border: 2px solid var(--white); text-decoration: none; font-weight: 600; }
  .btn:hover { background: var(--white); color: var(--black); }

  section { max-width: 52rem; margin: 0 auto; padding: clamp(3rem, 8vw, 5rem) 1rem; }
  h2 { font-weight: 300; font-size: clamp(2.25rem, 6vw, 3.5rem); line-height: 1; margin: 0 0 2rem; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: 11rem 1fr auto; gap: .25rem 1.5rem; padding: 1.5rem 0 1.5rem 1.25rem; position: relative; }
  /* Each show stands on a bar, the soonest one tallest. */
  li::before { content: ''; position: absolute; left: 0; bottom: 1.5rem; width: 6px; height: var(--h); background: var(--white); }
  time { font-weight: 600; font-size: 1.25rem; }
  .venue { font-size: 1.25rem; }
  .where { color: var(--grey); grid-column: 2; }
  .tickets { grid-row: 1; grid-column: 3; align-self: center; font-weight: 600; }
  @media (max-width: 40rem) {
    nav span.lbl { display: none; }
    li { grid-template-columns: 1fr; }
    .where, .tickets { grid-column: 1; grid-row: auto; }
  }
</style>
</head>
<body>
<header>
  <nav aria-label="Sections"><ul>
    <li><a href="#" style="--h:1.75rem">music</a></li>
    <li><a href="#" style="--h:3rem">videos</a></li>
    <li><a href="#shows" style="--h:4.5rem" aria-current="true">shows</a></li>
    <li><a href="#" style="--h:3rem">about</a></li>
    <li><a href="#" style="--h:1.75rem">press</a></li>
  </ul></nav>
</header>
<main>
  <div class="hero">
    <h1 class="wordmark">icarusdown</h1>
    <div class="photo"><img src="../../src/assets/media/Zagorje 2026 Stage.JPG" alt="The band on stage at MC ZoS Zagorje under coloured beams"></div>
  </div>
  <div class="release">
    <p><strong>Upcoming Single</strong><span>new single, out 12 Dec</span></p>
    <a class="btn" href="#">Pre-save</a>
  </div>
  <section id="shows">
    <h2>shows</h2>
    <ol>
      <li style="--h:3.5rem"><time datetime="2026-11-28">Sat 28 Nov</time><div class="venue">Placeholder Club</div><div class="where">Ljubljana, Slovenia. Free entry</div><a class="tickets" href="#">Tickets</a></li>
      <li style="--h:2rem"><time datetime="2027-02-13">Sat 13 Feb 2027</time><div class="venue">Placeholder Hall</div><div class="where">Zagreb, Croatia</div></li>
    </ol>
  </section>
</main>
</body>
</html>
