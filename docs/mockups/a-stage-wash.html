<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup A: Stage wash</title>
<!-- Mockup only: the real site self-hosts these fonts via @fontsource. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0a1a33;      /* the hall's blue dark, not grey-black */
    --wash: #3ccbd9;       /* teal stage wash */
    --violet: #9b7bff;     /* the beam colour from the wide stage shot */
    --text: #eef4fb;
    --muted: #a8b8cc;
    --display: 'Big Shoulders Display', sans-serif;
    --body: 'Atkinson Hyperlegible', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--night); color: var(--text); font: 400 1.0625rem/1.55 var(--body); }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--wash); outline-offset: 3px; }

  header { position: absolute; inset: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 1rem clamp(1rem, 4vw, 3rem); z-index: 2; }
  header img { width: 56px; height: 56px; mix-blend-mode: screen; }
  nav { display: flex; gap: clamp(.75rem, 2.5vw, 2rem); font: 500 1.125rem/1 var(--display); letter-spacing: .02em; }
  nav a { text-decoration: none; padding: .5rem 0; }
  nav a:hover { color: var(--wash); }

  .hero { position: relative; min-height: min(92vh, 860px); display: grid; align-items: end; overflow: hidden; }
  .hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 30% 40%; }
  .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgb(10 26 51 / .55) 0%, rgb(10 26 51 / 0) 30%, rgb(10 26 51 / .2) 55%, var(--night) 100%); }
  .hero-copy { position: relative; z-index: 1; padding: 0 clamp(1rem, 4vw, 3rem) clamp(2rem, 6vw, 4rem); max-width: 60rem; }
  h1 { margin: 0; font: 800 clamp(4rem, 15vw, 11rem)/.82 var(--display); letter-spacing: -.01em; text-transform: lowercase; }
  .release { margin-top: 1.5rem; display: flex; flex-wrap: wrap; align-items: center; gap: 1rem 1.5rem; }
  .release img { width: 88px; height: 88px; }
  .release p { margin: 0; }
  .release strong { display: block; font: 800 1.75rem/1.05 var(--display); }
  .release span { color: var(--muted); }
  .btn { display: inline-block; padding: .8rem 1.4rem; background: var(--wash); color: var(--night); font-weight: 700; text-decoration: none; border-radius: 999px; }
  .btn:hover { background: var(--text); }

  section { padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 4vw, 3rem); max-width: 72rem; }
  h2 { margin: 0 0 2rem; font: 800 clamp(2.5rem, 7vw, 4.5rem)/.9 var(--display); color: var(--violet); }
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: 6.5rem 1fr auto; gap: 1rem 1.5rem; align-items: center; padding: 1.25rem 0; border-top: 1px solid rgb(168 184 204 / .25); }
  time { font-family: var(--display); line-height: .9; }
  time b { display: block; font-size: 3.25rem; font-weight: 800; }
  time i { font-style: normal; font-size: 1.125rem; font-weight: 500; color: var(--muted); }
  .venue { font-weight: 700; font-size: 1.25rem; }
  .where { color: var(--muted); }
  .tickets { color: var(--wash); font-weight: 700; }
  @media (max-width: 40rem) {
    nav { display: none; }
    li { grid-template-columns: 5rem 1fr; }
    .tickets { grid-column: 2; }
  }
</style>
</head>
<body>
<header>
  <img src="../../src/assets/brand/logo.png" alt="Icarus Down">
  <nav aria-label="Sections"><a href="#">Music</a><a href="#">Videos</a><a href="#shows">Shows</a><a href="#">About</a><a href="#">Press</a></nav>
</header>
<main>
  <div class="hero">
    <img src="../../src/assets/media/zagorje-2026-singer-silhouette.jpg" alt="The singer in silhouette against blue stage light">
    <div class="hero-copy">
      <h1>Icarus Down</h1>
      <div class="release">
        <img src="../../src/assets/media/cover-placeholder-1.jpg" alt="">
        <p><strong>Upcoming Single</strong><span>New single, out 12 Dec</span></p>
        <a class="btn" href="#">Pre-save</a>
      </div>
    </div>
  </div>
  <section id="shows">
    <h2>Shows</h2>
    <ol>
      <li><time datetime="2026-11-28"><b>28</b><i>Sat Nov</i></time><div><div class="venue">Placeholder Club</div><div class="where">Ljubljana, Slovenia · Free entry</div></div><a class="tickets" href="#">Tickets</a></li>
      <li><time datetime="2027-02-13"><b>13</b><i>Sat Feb 2027</i></time><div><div class="venue">Placeholder Hall</div><div class="where">Zagreb, Croatia</div></div></li>
    </ol>
  </section>
</main>
</body>
</html>
