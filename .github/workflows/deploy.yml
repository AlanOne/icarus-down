name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild so past shows drop out of the HTML even with no edits.
  # 23:15 UTC is 00:15 in Ljubljana in winter and 01:15 in summer.
  schedule:
    - cron: '15 23 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:build
      - run: npm run a11y
      # Build once more against empty content: no section may need content to pass.
      - run: npm run test:empty
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
